<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=0.1">
    <title>Contact</title>
    <link rel="stylesheet" href="../css/styles-new.css">
    <link href="https://fonts.googleapis.com/css2?family=Marmelad&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header>
        <a href="javascript:window.scrollTo(0,0);">
            <img src="images/logo-no-text.png" alt="Charlie Schwartz Logo">
        </a>
        <nav>
            <button id="menu-toggle" aria-label="Toggle Menu">&#9776;</button>
            <ul id="menu">
                <a href="../index.html"><li>Home</li></a>
                <a href="../pages/work.html"><li>My Work</li></a>
                <a href="../pages/resume.html"><li>Resume</li></a>
                <a href="../pages/contact.html"><li>Contact</li></a>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
     <div class="large-header">
     </div>
     <div class="blue-header">
        <h2>Contact Me</h2>
     </div>

     <div class="contact-wrapper">
        <p>My inbox is always open, you can contact me with the contact form here or with the details below:</p>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>
        <input type="submit" value="Submit">
    </div>

    <!-- Footer -->
    <footer>
        <div id="footer-text-wrapper">
            <p>© 2023 Charlie Schwartz. All rights reserved.</p> 
        </div>
        <div id="footer-img-wrapper">
            <img src="../images/linkedin.svg" alt="LinkedIn" width="30" height="30">
            <img src="../images/mail.svg" alt="Email" width="30" height="30">
            <img src="../images/github.svg" alt="GitHub" width="30" height="30">
        </div>
    </footer>

    <script src="nav-script.js"></script>
</body>
</html>
